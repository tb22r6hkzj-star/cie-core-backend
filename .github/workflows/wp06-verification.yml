name: WP-06 verification
on:
  push:
    branches: [visioncore-rc1-wp06-decision-hardening]
permissions:
  contents: read
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-rc1-wp06-decision-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run WP-06 decision hardening tests
        run: NODE_ENV=test node --test test/perceptionV6Hardening.test.js
      - name: Run WP-05 explainability tests
        run: NODE_ENV=test node --test test/accessoryPalettePreservation.test.js
      - name: Run WP-03 bridge tests
        run: NODE_ENV=test node --test test/wp03V6HardeningBridge.test.js
      - name: Run full suite
        run: npm test
