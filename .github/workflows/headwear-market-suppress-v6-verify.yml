name: Headwear market suppression V6 verification
on:
  push:
    branches: [visioncore-headwear-market-suppress-v6]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-headwear-market-suppress-v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply V6 patch
        run: python scripts/headwear-market-suppress-v6-patch.py
      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/ui/marketPublicationPolicy.js
      - name: V6 market publication policy
        run: NODE_ENV=test node --test test/headwearMarketSuppressionV6.test.js
      - name: V5 headwear publication regression
        run: NODE_ENV=test node --test test/headwearPublicationV5.test.js
      - name: Object presence V1 regression
        run: NODE_ENV=test node --test test/objectPresenceV1.test.js
      - name: Object presence V2 publication regression
        run: NODE_ENV=test node --test test/objectPresenceV2Publication.test.js
      - name: Object presence V3 regression
        run: NODE_ENV=test node --test test/objectPresenceV3.test.js
      - name: Confidence normalization regression
        run: NODE_ENV=test node --test test/perceptionConfidenceNormalization.test.js
      - name: Perception V6 pixel regression
        run: NODE_ENV=test node --test test/perceptionV6Pixel.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js src/ui/marketPublicationPolicy.js test/headwearMarketSuppressionV6.test.js
          git commit -m 'Suppress headwear in market assist publication' || exit 0
          git push
