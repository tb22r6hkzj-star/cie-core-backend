name: Headwear market suppression V6 verification
on:
  push:
    branches: [visioncore-headwear-market-suppress-v6]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-headwear-market-suppress-v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply V6 patch
        run: python scripts/headwear-market-suppress-v6-patch.py
      - name: Syntax check
        run: node --check src/server.js
      - name: Targeted publication gate
        run: NODE_ENV=test node --test test/headwearMarketSuppressionV6.test.js test/headwearPublicationV5.test.js test/objectPresenceV1.test.js test/objectPresenceV2Publication.test.js test/objectPresenceV3.test.js test/perceptionConfidenceNormalization.test.js test/perceptionV6Pixel.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js test/headwearMarketSuppressionV6.test.js
          git commit -m 'Suppress headwear in market assist publication' || exit 0
          git push
