name: True Accessory Micro Crop V1
on:
  push:
    branches: [visioncore-true-accessory-microcrop-v1]
  pull_request:
    branches: [main]
    paths:
      - 'src/server.js'
      - 'src/intelligence/accessoryTrueMicroCropV1.js'
      - 'test/accessoryTrueMicroCropV1.test.js'
      - '.github/workflows/true-accessory-microcrop-v1.yml'
permissions:
  contents: write
jobs:
  microcrop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply true micro-crop wiring
        run: python3 scripts/wire_true_accessory_microcrop_v1.py
      - run: npm install --no-audit --no-fund
      - name: Focused regressions
        run: NODE_ENV=test node --test test/accessoryTrueMicroCropV1.test.js test/targetedMicroCropIdentityFallbackV1.test.js test/accessoryEvidenceContractV1.test.js
      - name: Syntax
        run: node --check src/server.js && node --check src/intelligence/accessoryTrueMicroCropV1.js
      - name: Full suite serial
        shell: bash
        run: |
          set +e
          NODE_ENV=test node --test --test-concurrency=1 > /tmp/true-microcrop-serial.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== VisionCore first serial failure ==="
            failure_line=$(grep -n '^not ok ' /tmp/true-microcrop-serial.log | head -n 1 | cut -d: -f1)
            if [ -n "$failure_line" ]; then
              start=$((failure_line > 25 ? failure_line - 25 : 1))
              end=$((failure_line + 100))
              sed -n "${start},${end}p" /tmp/true-microcrop-serial.log
            else
              echo "No TAP not-ok line found; showing final 200 lines."
              tail -n 200 /tmp/true-microcrop-serial.log
            fi
          else
            echo "Serial suite passed."
            tail -n 30 /tmp/true-microcrop-serial.log
          fi
          exit "$status"
      - name: Full suite normal
        run: NODE_ENV=test node --test
      - name: Commit live true micro-crop wiring
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Wire true original-image accessory micro-crop into live transform"
          git push origin HEAD:${{ github.ref_name }}
