name: Object Presence V3 verification
on:
  push:
    branches: [visioncore-headwear-presence-v3]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-headwear-presence-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply V3 patch
        run: python scripts/headwear-presence-v3-patch.py
      - name: Syntax check
        run: node --check src/intelligence/perceptionV6/index.js
      - name: Targeted object-presence gate
        run: NODE_ENV=test node --test test/objectPresenceV3.test.js test/objectPresenceV1.test.js test/objectPresenceV2Publication.test.js test/perceptionV6Pixel.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/intelligence/perceptionV6/index.js test/objectPresenceV3.test.js
          git commit -m 'Object Presence V3: require independent headwear structure' || exit 0
          git push
