name: WP-02 final verification

on:
  push:
    branches:
      - codex/fix-wp-02-compliance-gaps

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run targeted WP-02 tests
        run: NODE_ENV=test node --test test/perceptionV6Pixel.test.js
      - name: Run full test suite
        run: npm test
      - name: Remove temporary verification workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wp02-final-verification.yml
          git commit -m "Remove temporary WP-02 verification workflow"
          git push origin HEAD:codex/fix-wp-02-compliance-gaps
