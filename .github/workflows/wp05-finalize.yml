name: WP-05 finalize
on:
  push:
    branches:
      - visioncore-rc1-wp05-explainability
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize WP-05 explainability publication ordering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-rc1-wp05-explainability
      - name: Apply final ordering fix
        run: python scripts/wp05-finalize-patch.py
      - name: Verify syntax
        run: node --check src/server.js
      - name: Commit final ordering fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize WP-05 explainability publication ordering"
          git push origin HEAD:visioncore-rc1-wp05-explainability
