name: Piece Color Ownership V1 Bootstrap

on:
  push:
    branches:
      - visioncore-piece-color-ownership-v1

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-piece-color-ownership-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply guarded server integration
        run: node scripts/apply-piece-color-ownership-v1.mjs
      - name: Run focused ownership regressions
        run: NODE_ENV=test node --test test/pieceColorOwnershipV1.test.js test/colorEvidenceV3.test.js test/colorEvidenceV3Publication.test.js test/colorEvidenceV3Handoff.test.js test/sceneBoundaryPurityV1.test.js
      - name: Validate syntax
        run: node --check src/server.js && node --check src/intelligence/pieceColorOwnershipV1.js
      - name: Commit integration when needed
        run: |
          if git diff --quiet -- src/server.js; then
            echo "Server integration already present."
            exit 0
          fi
          git config user.name "visioncore-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/server.js
          git commit -m "feat: integrate piece-level color ownership"
          git push origin HEAD:visioncore-piece-color-ownership-v1
