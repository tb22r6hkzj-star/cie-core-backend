name: Accessory Positive Mask Ownership V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/intelligence/accessoryPositiveMaskOwnershipV1.js'
      - 'src/intelligence/pieceColorOwnershipV1.js'
      - 'src/server.js'
      - 'test/accessoryPositiveMaskOwnershipV1.test.js'
      - 'test/accessoryPositiveMaskProductionWiringV1.test.js'
      - '.github/workflows/accessory-positive-mask-ownership-v1.yml'
  push:
    branches: [main]
    paths:
      - 'src/intelligence/accessoryPositiveMaskOwnershipV1.js'
      - 'src/intelligence/pieceColorOwnershipV1.js'
      - 'src/server.js'
      - 'test/accessoryPositiveMaskOwnershipV1.test.js'
      - 'test/accessoryPositiveMaskProductionWiringV1.test.js'
      - '.github/workflows/accessory-positive-mask-ownership-v1.yml'
jobs:
  positive-mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Focused regressions
        run: NODE_ENV=test node --test test/accessoryPositiveMaskOwnershipV1.test.js test/accessoryPositiveMaskProductionWiringV1.test.js test/accessoryColorOwnershipV1.test.js test/pieceColorOwnershipV1.test.js
      - name: Syntax
        run: node --check src/intelligence/accessoryPositiveMaskOwnershipV1.js && node --check src/intelligence/pieceColorOwnershipV1.js && node --check src/server.js
      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1
      - name: Full suite normal
        run: NODE_ENV=test node --test
