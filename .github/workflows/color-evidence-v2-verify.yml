name: Color Evidence V2 verification
on:
  push:
    branches: [visioncore-color-evidence-v2]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-color-evidence-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Apply patch
        run: python scripts/color-evidence-v2-patch.py
      - name: Syntax
        run: node --check src/server.js
      - name: Color Evidence V1
        run: NODE_ENV=test node --test test/colorEvidenceV1.test.js
      - name: Color Evidence V2
        run: NODE_ENV=test node --test test/colorEvidenceV2.test.js
      - name: Accuracy and authority regressions
        run: NODE_ENV=test node --test test/publicationConsistencyAccuracyV1.test.js test/colorAuthorityV1.test.js
      - name: Perception publication regressions
        run: NODE_ENV=test node --test test/headwearMarketSuppressionV6.test.js test/perceptionV6Pixel.test.js test/objectPresenceV2Publication.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js test/colorEvidenceV2.test.js
          git commit -m 'Use strong color evidence to correct dark garment contamination' || exit 0
          git push
