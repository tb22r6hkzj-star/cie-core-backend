name: Garment Color Constancy V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/intelligence/garmentColorConstancyV1.js"
      - "src/intelligence/garmentColorConstancyIntegrationV1.js"
      - "src/intelligence/garmentToneStabilityV1.js"
      - "test/garmentColorConstancyV1.test.js"
      - "test/garmentColorConstancyIntegrationV1.test.js"
      - "test/garmentToneStabilityV1.test.js"
      - ".github/workflows/garment-color-constancy-v1.yml"
  workflow_dispatch:

jobs:
  garment-color-constancy-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Color constancy focused tests
        run: NODE_ENV=test node --test test/garmentColorConstancyV1.test.js test/garmentColorConstancyIntegrationV1.test.js test/garmentToneStabilityV1.test.js

      - name: Module syntax
        run: node --check src/intelligence/garmentColorConstancyV1.js && node --check src/intelligence/garmentColorConstancyIntegrationV1.js && node --check src/intelligence/garmentToneStabilityV1.js

      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1

      - name: Full suite normal
        run: NODE_ENV=test npm test
