name: GroundingDINO Query Plan V1
on:
  push:
    branches: [visioncore-accessory-env-override-v1]
  pull_request:
    branches: [main]
    paths:
      - 'src/server.js'
      - 'src/intelligence/groundingDinoQueryPlanV1.js'
      - 'test/groundingDinoQueryPlanV1.test.js'
      - '.github/workflows/grounding-dino-query-plan-v1.yml'
permissions:
  contents: write
jobs:
  query-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply query-plan wiring
        run: python3 scripts/wire_grounding_dino_query_plan_v1.py
      - run: npm install --no-audit --no-fund
      - name: Focused regression
        run: NODE_ENV=test node --test test/groundingDinoQueryPlanV1.test.js
      - name: Syntax
        run: node --check src/server.js && node --check src/intelligence/groundingDinoQueryPlanV1.js
      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1
      - name: Full suite normal
        run: NODE_ENV=test node --test
      - name: Commit live query-plan wiring
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Keep accessory GroundingDINO lane active under env override"
          git push origin HEAD:${{ github.ref_name }}
