name: Production Publication Bootstrap V1
on:
  push:
    branches: [visioncore-production-publication-bootstrap-v1]
  pull_request:
    branches: [main]
    paths:
      - 'src/server.js'
      - 'src/intelligence/liveServerTelemetryPreloadV1.js'
      - 'src/intelligence/accessoryPublicationBridgeV1.js'
      - 'src/intelligence/accessoryCanonicalPublicationV2.js'
      - '.github/workflows/production-publication-bootstrap-v1.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply production bootstrap
        run: python3 scripts/wire_production_publication_bootstrap_v1.py
      - run: npm install --no-audit --no-fund
      - name: Verify direct server bootstrap
        run: |
          grep -F 'import "./intelligence/liveServerTelemetryPreloadV1.js";' src/server.js
          node --check src/server.js
          node --check src/intelligence/liveServerTelemetryPreloadV1.js
      - name: Focused publication regressions
        run: NODE_ENV=test node --test test/accessoryCanonicalPublicationV2.test.js test/accessoryPublicationBridgeV1.test.js test/jewelryPositiveMaskOnlyV1.test.js test/accessoryPositiveMaskOwnershipV1.test.js
      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1
      - name: Full suite normal
        run: NODE_ENV=test node --test
      - name: Commit direct bootstrap
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Bootstrap live publication guards in direct server start"
          git push origin HEAD:${{ github.ref_name }}
