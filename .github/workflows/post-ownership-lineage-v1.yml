name: Post Ownership Lineage V1

on:
  pull_request:
    branches: [main]
    paths:
      - src/server.js
      - src/intelligence/accessoryPublicationBridgeV1.js
      - test/accessoryPublicationBridgeV1.test.js
      - .github/workflows/post-ownership-lineage-v1.yml

jobs:
  post-ownership-lineage-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Focused lineage tests
        run: NODE_ENV=test node --test test/accessoryPublicationBridgeV1.test.js test/accessoryColorOwnershipV1.test.js

      - name: Module syntax
        run: |
          node --check src/intelligence/accessoryPublicationBridgeV1.js
          node --check src/server.js

      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1

      - name: Full suite normal
        run: NODE_ENV=test npm test
