name: Market hardening 01 reconstruction
on:
  push:
    branches: [visioncore-market-hardening-01]
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-market-hardening-01
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/market-hardening-01-patch.py
      - name: Syntax check
        run: node --check src/server.js
      - name: Targeted market mode tests
        run: NODE_ENV=test node --test test/marketPerceptionMode.test.js test/perceptionV6Pixel.test.js
      - name: Full suite
        run: npm install && npm test
      - name: Persist validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js test/marketPerceptionMode.test.js
          git commit -m 'Use V6 assist mode for market-facing analysis' || exit 0
          git push
