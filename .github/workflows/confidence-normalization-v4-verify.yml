name: Confidence normalization V4 verification
on:
  push:
    branches: [visioncore-confidence-normalization-v4]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-confidence-normalization-v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply V4 patch
        run: python scripts/confidence-normalization-v4-patch.py
      - name: Syntax check
        run: |
          node --check src/intelligence/perceptionV5/index.js
          node --check src/intelligence/perceptionV6/index.js
      - name: Targeted confidence and perception gate
        run: NODE_ENV=test node --test test/perceptionConfidenceNormalization.test.js test/objectPresenceV3.test.js test/objectPresenceV1.test.js test/objectPresenceV2Publication.test.js test/perceptionV6Pixel.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/intelligence/perceptionV5/index.js src/intelligence/perceptionV6/index.js test/perceptionConfidenceNormalization.test.js
          git commit -m 'Normalize detector confidence at perception boundary' || exit 0
          git push
