name: WP-06 reconstruction
on:
  push:
    branches: [visioncore-rc1-wp06-decision-hardening]
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-rc1-wp06-decision-hardening
      - name: Apply WP-06 patch
        run: python scripts/wp06-decision-hardening-patch.py
      - name: Verify syntax
        run: node --check src/server.js
      - name: Commit reconstruction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js
          git commit -m 'Reconstruct WP-06 decision hardening' || exit 0
          git push
