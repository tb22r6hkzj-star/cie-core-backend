name: Color authority V1 verification
on:
  push:
    branches: [visioncore-color-authority-v1]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-color-authority-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Apply patch
        run: python scripts/color-authority-v1-patch.py
      - name: Syntax
        run: node --check src/server.js
      - name: Color authority regression
        run: NODE_ENV=test node --test test/colorAuthorityV1.test.js
      - name: Perception and publication regressions
        run: NODE_ENV=test node --test test/headwearMarketSuppressionV6.test.js test/perceptionV6Pixel.test.js test/objectPresenceV2Publication.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js test/colorAuthorityV1.test.js
          git commit -m 'Make published garment colors authoritative for style reasoning' || exit 0
          git push
