name: Jewelry Positive Mask Only V1
on:
  push:
    branches: [visioncore-accessory-canonical-publication-v1]
  pull_request:
    branches: [main]
    paths:
      - 'src/intelligence/pieceColorOwnershipV1.js'
      - 'src/intelligence/accessoryCanonicalPublicationV2.js'
      - 'test/jewelryPositiveMaskOnlyV1.test.js'
      - '.github/workflows/jewelry-positive-mask-only-v1.yml'
permissions:
  contents: write
jobs:
  positive-mask-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply jewelry mask-only doctrine
        run: python3 scripts/enforce_jewelry_positive_mask_only_v1.py
      - run: npm install --no-audit --no-fund
      - name: Focused regressions
        run: NODE_ENV=test node --test test/jewelryPositiveMaskOnlyV1.test.js test/accessoryPositiveMaskOwnershipV1.test.js test/accessoryCanonicalPublicationV2.test.js test/accessoryPublicationBridgeV1.test.js test/pieceColorOwnershipV1.test.js
      - name: Syntax
        run: node --check src/intelligence/pieceColorOwnershipV1.js && node --check src/intelligence/accessoryCanonicalPublicationV2.js
      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1
      - name: Full suite normal
        run: NODE_ENV=test node --test
      - name: Commit patched ownership
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/intelligence/pieceColorOwnershipV1.js
          git commit -m "Enforce positive mask for jewelry color authority"
          git push origin HEAD:${{ github.ref_name }}
