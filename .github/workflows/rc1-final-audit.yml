name: RC1 final audit
on:
  push:
    branches: [visioncore-rc1-wp07-evaluation-framework]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-rc1-wp07-evaluation-framework
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Startup and health smoke
        run: |
          PORT=3000 node src/server.js > /tmp/visioncore-server.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/visioncore-server.log' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/visioncore-server.log
          exit 1
      - name: V6 mode and API compatibility regressions
        run: NODE_ENV=test node --test test/perceptionV6Pixel.test.js test/accessoryPalettePreservation.test.js test/perceptionV6Hardening.test.js
      - name: WP-07 evaluation framework
        run: NODE_ENV=test node --test test/visionCoreEvaluationFramework.test.js
      - name: Full suite
        run: npm test
