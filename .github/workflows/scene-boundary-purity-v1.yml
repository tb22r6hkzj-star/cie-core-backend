name: Scene Boundary Purity V1

on:
  push:
    branches:
      - visioncore-scene-boundary-purity-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run scene boundary purity regressions
        run: NODE_ENV=test node --test test/sceneBoundaryPurityV1.test.js
      - name: Run full suite
        shell: bash
        run: |
          set -o pipefail
          NODE_ENV=test npm test 2>&1 | tee scene-boundary-full-suite.tap
      - name: Preserve full-suite output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-boundary-full-suite
          path: scene-boundary-full-suite.tap
          if-no-files-found: error
