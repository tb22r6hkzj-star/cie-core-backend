name: Scene Boundary Purity V1

on:
  push:
    branches:
      - visioncore-scene-boundary-purity-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run scene boundary purity regressions
        run: NODE_ENV=test node --test test/sceneBoundaryPurityV1.test.js
      - name: Run full suite
        run: NODE_ENV=test npm test
