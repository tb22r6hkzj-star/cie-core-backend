name: Scene Boundary Purity V1

on:
  push:
    branches:
      - visioncore-scene-boundary-purity-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-scene-boundary-purity-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply guarded spatial interior sampling fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/intelligence/colorEvidence/index.js")
          text = path.read_text()
          old = '''const INTERIOR_WINDOW_SPECS = [
            { id: "center", x: 0.34, y: 0.30, w: 0.32, h: 0.40 },
            { id: "upper", x: 0.34, y: 0.12, w: 0.32, h: 0.26 },
            { id: "lower", x: 0.34, y: 0.62, w: 0.32, h: 0.26 },
          ];'''
          new = '''const INTERIOR_WINDOW_SPECS = [
            { id: "center", x: 0.34, y: 0.30, w: 0.32, h: 0.40 },
            { id: "upper", x: 0.34, y: 0.12, w: 0.32, h: 0.26 },
            { id: "lower", x: 0.34, y: 0.62, w: 0.32, h: 0.26 },
            { id: "left_interior", x: 0.30, y: 0.30, w: 0.18, h: 0.40 },
            { id: "right_interior", x: 0.52, y: 0.30, w: 0.18, h: 0.40 },
          ];'''
          if new in text:
              print("Spatial interior fix already present.")
          else:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one interior sampling block, found {count}")
              path.write_text(text.replace(old, new, 1))
      - name: Run scene boundary purity regressions
        run: NODE_ENV=test node --test test/sceneBoundaryPurityV1.test.js
      - name: Run legacy color-evidence ambiguity regressions
        run: NODE_ENV=test node --test test/colorEvidenceV1.test.js
      - name: Run full suite
        run: NODE_ENV=test npm test
      - name: Commit validated spatial interior fix
        run: |
          git config user.name "visioncore-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/intelligence/colorEvidence/index.js
          if git diff --cached --quiet; then
            echo "No spatial interior changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve spatial disagreement inside garment purity"
          git push origin HEAD:visioncore-scene-boundary-purity-v1
