name: Live Server Telemetry V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/intelligence/liveServerTelemetryPreloadV1.js"
      - "src/intelligence/recommendationRuntimeTelemetryV1.js"
      - "src/intelligence/analysisLatencyRuntimeV1.js"
      - "src/intelligence/analysisLatencyTelemetryV1.js"
      - "test/liveServerTelemetryPreloadV1.test.js"
      - "package.json"
      - ".github/workflows/live-server-telemetry-v1.yml"
  workflow_dispatch:

jobs:
  live-server-telemetry-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Focused live telemetry test
        run: NODE_ENV=test node --test test/liveServerTelemetryPreloadV1.test.js test/recommendationRuntimeTelemetryV1.test.js test/analysisLatencyRuntimeV1.test.js

      - name: Module syntax
        run: node --check src/intelligence/liveServerTelemetryPreloadV1.js

      - name: Production start syntax
        run: node --import ./src/intelligence/liveServerTelemetryPreloadV1.js --check src/server.js

      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1

      - name: Full suite normal
        run: NODE_ENV=test npm test
