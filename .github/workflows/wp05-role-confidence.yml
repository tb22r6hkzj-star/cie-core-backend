name: WP-05 role confidence fix
on:
  push:
    branches:
      - visioncore-rc1-wp05-explainability
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Preserve calibrated confidence across accessory display roles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-rc1-wp05-explainability
      - name: Apply role confidence fix
        run: python scripts/wp05-role-confidence-patch.py
      - name: Verify syntax
        run: node --check src/server.js
      - name: Commit role confidence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve calibrated confidence across accessory display roles"
          git push origin HEAD:visioncore-rc1-wp05-explainability
