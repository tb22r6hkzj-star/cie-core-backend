name: WP-04 reconstruction
on:
  push:
    branches:
      - visioncore-rc1-wp04-accessory-palette
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply WP-04 patch
        run: python3 scripts/wp04_reconstruct.py
      - name: Verify syntax
        run: node --check src/server.js
      - name: Commit reconstruction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git rm scripts/wp04_reconstruct.py .github/workflows/wp04-reconstruct.yml
          git commit -m "Reconstruct WP-04 accessory display palette precedence"
          git push origin HEAD:visioncore-rc1-wp04-accessory-palette
