name: Object presence v2 verification
on:
  push:
    branches: [visioncore-object-presence-v2]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply publication identity reconciliation patch
        run: python scripts/object-presence-v2-publication-reconcile.py
      - run: node --check src/server.js
      - name: Object Presence V2 regression
        run: NODE_ENV=test node --test test/objectPresenceV2Publication.test.js
      - name: Existing object presence and market regressions
        run: NODE_ENV=test node --test test/objectPresenceV1.test.js test/marketHardening02.test.js test/perceptionV6Pixel.test.js test/perceptionV6Hardening.test.js test/accessoryPalettePreservation.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated publication reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js
          git commit -m 'Reconcile accessory publication at object identity level' || exit 0
          git push
