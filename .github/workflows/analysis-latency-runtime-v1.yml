name: Analysis Latency Runtime V1

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/intelligence/analysisLatencyTelemetryV1.js"
      - "src/intelligence/analysisLatencyRuntimeV1.js"
      - "test/analysisLatencyTelemetryV1.test.js"
      - "test/analysisLatencyRuntimeV1.test.js"
      - ".github/workflows/analysis-latency-runtime-v1.yml"
  workflow_dispatch:

jobs:
  analysis-latency-runtime-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Focused latency tests
        run: NODE_ENV=test node --test test/analysisLatencyTelemetryV1.test.js test/analysisLatencyRuntimeV1.test.js

      - name: Module syntax
        run: node --check src/intelligence/analysisLatencyTelemetryV1.js && node --check src/intelligence/analysisLatencyRuntimeV1.js

      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1

      - name: Full suite normal
        run: NODE_ENV=test npm test
