name: Accessory Spatial Guidance V2

on:
  push:
    branches:
      - visioncore-accessory-spatial-guidance-v2
  pull_request:
    paths:
      - 'src/intelligence/external/openAIAccessorySpatialGuidanceV2.js'
      - 'src/intelligence/accessoryMicroCropRuntimeV1.js'
      - 'src/intelligence/pieceColorOwnershipV1.js'
      - 'test/accessorySpatialGuidanceV2.test.js'
      - '.github/workflows/accessory-spatial-guidance-v2.yml'

permissions:
  contents: write

jobs:
  accessory-spatial-guidance-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ownership wiring
        run: python3 scripts/wire_accessory_semantic_exclusions_v2.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused regressions
        run: NODE_ENV=test node --test test/accessorySpatialGuidanceV2.test.js test/accessoryMicroCropRuntimeV1.test.js test/accessoryMicroCropV1.test.js test/accessoryNoRegionGateV1.test.js test/accessoryFinalPublicationGateV1.test.js test/accessoryPublicationBridgeV1.test.js
      - name: Syntax
        run: node --check src/intelligence/external/openAIAccessorySpatialGuidanceV2.js && node --check src/intelligence/accessoryMicroCropRuntimeV1.js && node --check src/intelligence/pieceColorOwnershipV1.js
      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1
      - name: Full suite normal
        run: npm test
      - name: Commit ownership wiring
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/intelligence/pieceColorOwnershipV1.js; then
            echo 'No ownership patch to commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/intelligence/pieceColorOwnershipV1.js
            git commit -m 'Wire semantic exclusions into accessory ownership'
            git push
          fi
