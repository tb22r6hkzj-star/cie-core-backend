name: Resolve WP-02 conflict v3

on:
  push:
    branches:
      - codex/fix-wp-02-compliance-gaps

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve server conflict from persisted WP-02
        run: |
          git fetch origin visioncore-rc1-wp02-audit-fix
          git checkout origin/visioncore-rc1-wp02-audit-fix -- src/server.js
          python3 scripts/resolve-wp02-conflict.py
      - name: Commit resolved server and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/resolve-wp02-conflict.yml
          rm -f .github/workflows/resolve-wp02-conflict-v2.yml
          rm -f .github/workflows/resolve-wp02-conflict-v3.yml
          rm -f scripts/resolve-wp02-conflict.py
          git add -A
          git commit -m "Resolve WP-02 server conflict preserving persisted implementation"
          git push origin HEAD:codex/fix-wp-02-compliance-gaps
