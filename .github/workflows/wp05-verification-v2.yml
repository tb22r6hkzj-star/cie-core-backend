name: WP-05 verification v2
on:
  push:
    branches:
      - visioncore-rc1-wp05-explainability
permissions:
  contents: write
jobs:
  test:
    if: github.event.head_commit.message != 'Persist passing WP-05 explainability regressions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-rc1-wp05-explainability
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply WP-05 regressions
        run: python scripts/wp05-tests-patch.py
      - run: npm install
      - name: Run WP-05 explainability tests
        run: NODE_ENV=test node --test test/accessoryPalettePreservation.test.js
      - name: Run WP-03 bridge tests
        run: NODE_ENV=test node --test test/perceptionV6HardeningBridge.test.js
      - name: Run full suite
        run: npm test
      - name: Persist passing regressions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/accessoryPalettePreservation.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist passing WP-05 explainability regressions"
          git push origin HEAD:visioncore-rc1-wp05-explainability
