name: Language consistency v1 verification
on:
  push:
    branches: [visioncore-language-consistency-v1]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply language consistency patch
        run: python scripts/language-consistency-v1.py
      - run: node --check src/server.js
      - name: Language consistency regression
        run: NODE_ENV=test node --test test/languageConsistencyV1.test.js
      - name: Existing market and color regressions
        run: NODE_ENV=test node --test test/colorIdentityV2.test.js test/marketHardening02.test.js test/perceptionV6Pixel.test.js test/perceptionV6Hardening.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated language consistency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js
          git commit -m 'Deduplicate semantic descriptors in style explanations' || exit 0
          git push
