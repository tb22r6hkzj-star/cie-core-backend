name: Market hardening 02 verification
on:
  push:
    branches: [visioncore-market-hardening-02]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-market-hardening-02
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply patch
        run: python scripts/market-hardening-02-patch.py
      - name: Syntax checks
        run: node --check src/server.js && node --check src/intelligence/perceptionV6/index.js
      - name: Market hardening 02 regressions
        run: NODE_ENV=test node --test test/marketHardening02.test.js
      - name: Existing V6 regressions
        run: NODE_ENV=test node --test test/perceptionV6Pixel.test.js test/perceptionV6Hardening.test.js test/accessoryPalettePreservation.test.js
      - name: Full suite
        run: npm test
      - name: Persist validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js src/intelligence/perceptionV6/index.js test/marketHardening02.test.js
          git commit -m 'Harden phantom headwear and lower garment green consensus' || exit 0
          git push
