name: WP-07 verification
on:
  push:
    branches: [visioncore-rc1-wp07-evaluation-framework]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-rc1-wp07-evaluation-framework
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run WP-07 evaluation framework tests
        run: NODE_ENV=test node --test test/visionCoreEvaluationFramework.test.js
      - name: Run full suite
        run: npm test
