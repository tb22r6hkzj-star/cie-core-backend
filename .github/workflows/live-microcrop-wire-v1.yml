name: Live Micro Crop Wiring V1

on:
  push:
    branches: [visioncore-live-microcrop-wire-v1]
    paths:
      - "scripts/wire_live_microcrop_v1.py"
      - "test/liveMicroCropProductionWiringV1.test.js"
      - ".github/workflows/live-microcrop-wire-v1.yml"

permissions:
  contents: write

jobs:
  wire-live-microcrop-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-live-microcrop-wire-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply live call-site wiring
        run: python3 scripts/wire_live_microcrop_v1.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused production wiring tests
        run: NODE_ENV=test node --test test/liveMicroCropProductionWiringV1.test.js test/accessoryMicroCropRuntimeV1.test.js test/accessoryMicroCropV1.test.js
      - name: Server syntax
        run: node --check src/server.js
      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1
      - name: Full suite normal
        run: NODE_ENV=test npm test
      - name: Commit wired server
        run: |
          if git diff --quiet -- src/server.js; then
            echo "server already wired"
            exit 0
          fi
          git config user.name "visioncore-ci"
          git config user.email "visioncore-ci@users.noreply.github.com"
          git add src/server.js
          git commit -m "Wire accessory micro crop runtime into live transform"
          git push origin HEAD:visioncore-live-microcrop-wire-v1
