name: Color Evidence V1 verification
on:
  push:
    branches: [visioncore-color-evidence-v1]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-color-evidence-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Syntax
        run: node --check src/intelligence/colorEvidence/index.js
      - name: Color Evidence regression
        run: NODE_ENV=test node --test test/colorEvidenceV1.test.js
      - name: Accuracy and authority regressions
        run: NODE_ENV=test node --test test/publicationConsistencyAccuracyV1.test.js test/colorAuthorityV1.test.js
      - name: Perception publication regressions
        run: NODE_ENV=test node --test test/headwearMarketSuppressionV6.test.js test/perceptionV6Pixel.test.js test/objectPresenceV2Publication.test.js
      - name: Garment color identity suite
        run: NODE_ENV=test node --test test/garmentColorIdentity.test.js
      - name: Garment and market hardening suites
        run: NODE_ENV=test node --test test/marketHardening02.test.js test/colorIdentityV2.test.js test/colorClusters.test.js
      - name: Remaining suite
        run: |
          files=$(find test -name '*.test.js' ! -name 'colorEvidenceV1.test.js' ! -name 'publicationConsistencyAccuracyV1.test.js' ! -name 'colorAuthorityV1.test.js' ! -name 'headwearMarketSuppressionV6.test.js' ! -name 'perceptionV6Pixel.test.js' ! -name 'objectPresenceV2Publication.test.js' ! -name 'garmentColorIdentity.test.js' ! -name 'marketHardening02.test.js' ! -name 'colorIdentityV2.test.js' ! -name 'colorClusters.test.js' -print)
          NODE_ENV=test node --test $files
