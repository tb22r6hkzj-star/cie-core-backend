name: Accessory No Region Gate V1

on:
  push:
    branches: [visioncore-accessory-no-region-gate-v1]
    paths:
      - "scripts/wire_accessory_no_region_gate_v1.py"
      - "test/accessoryNoRegionGateV1.test.js"
      - ".github/workflows/accessory-no-region-gate-v1.yml"

permissions:
  contents: write

jobs:
  accessory-no-region-gate-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-accessory-no-region-gate-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bridge patch
        run: python3 scripts/wire_accessory_no_region_gate_v1.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused regression
        run: NODE_ENV=test node --test test/accessoryNoRegionGateV1.test.js test/accessoryFinalPublicationGateV1.test.js test/accessoryPublicationBridgeV1.test.js
      - name: Syntax
        run: node --check src/intelligence/accessoryPublicationBridgeV1.js
      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1
      - name: Full suite normal
        run: NODE_ENV=test npm test
      - name: Commit patched bridge
        run: |
          if git diff --quiet -- src/intelligence/accessoryPublicationBridgeV1.js; then
            echo "bridge already patched"
            exit 0
          fi
          git config user.name "visioncore-ci"
          git config user.email "visioncore-ci@users.noreply.github.com"
          git add src/intelligence/accessoryPublicationBridgeV1.js
          git commit -m "Withhold accessory color without ownership region"
          git push origin HEAD:visioncore-accessory-no-region-gate-v1
