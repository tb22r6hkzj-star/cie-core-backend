name: Publication consistency accuracy V1 verification
on:
  push:
    branches: [visioncore-publication-consistency-accuracy-v1]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-publication-consistency-accuracy-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Apply patch
        run: python scripts/publication-consistency-accuracy-v1-patch.py
      - name: Syntax
        run: node --check src/server.js
      - name: Accuracy regression
        run: NODE_ENV=test node --test test/publicationConsistencyAccuracyV1.test.js
      - name: Color authority regression
        run: NODE_ENV=test node --test test/colorAuthorityV1.test.js
      - name: Perception publication regressions
        run: NODE_ENV=test node --test test/headwearMarketSuppressionV6.test.js test/perceptionV6Pixel.test.js test/objectPresenceV2Publication.test.js
      - name: Garment color identity suite
        run: NODE_ENV=test node --test test/garmentColorIdentity.test.js
      - name: Garment and color suites
        run: NODE_ENV=test node --test test/marketHardening02.test.js test/colorIdentityV2.test.js test/colorClusters.test.js
      - name: Remaining suite
        run: |
          files=$(find test -name '*.test.js' ! -name 'publicationConsistencyAccuracyV1.test.js' ! -name 'colorAuthorityV1.test.js' ! -name 'headwearMarketSuppressionV6.test.js' ! -name 'perceptionV6Pixel.test.js' ! -name 'objectPresenceV2Publication.test.js' ! -name 'garmentColorIdentity.test.js' ! -name 'marketHardening02.test.js' ! -name 'colorIdentityV2.test.js' ! -name 'colorClusters.test.js' -print)
          NODE_ENV=test node --test $files
      - name: Persist validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js test/publicationConsistencyAccuracyV1.test.js
          git commit -m 'Resolve consumer garment colors from trusted finalized evidence' || exit 0
          git push
