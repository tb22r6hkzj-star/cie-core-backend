name: Stage Timing V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/intelligence/externalStageTimingV2.js'
      - 'src/intelligence/liveServerTelemetryPreloadV1.js'
      - 'test/externalStageTimingV2.test.js'
      - 'test/liveServerTelemetryPreloadV1.test.js'
      - '.github/workflows/stage-timing-v2.yml'

jobs:
  stage-timing-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused timing tests
        run: NODE_ENV=test node --test test/externalStageTimingV2.test.js test/liveServerTelemetryPreloadV1.test.js
      - name: Module syntax
        run: node --check src/intelligence/externalStageTimingV2.js && node --check src/intelligence/liveServerTelemetryPreloadV1.js
      - name: Full suite serial
        run: NODE_ENV=test node --test --test-concurrency=1
      - name: Full suite normal
        run: NODE_ENV=test npm test
