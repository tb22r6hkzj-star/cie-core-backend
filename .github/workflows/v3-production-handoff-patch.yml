name: V3 production handoff patch

on:
  push:
    branches:
      - visioncore-color-evidence-v3-fusion
    paths:
      - .github/workflows/v3-production-handoff-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visioncore-color-evidence-v3-fusion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply exact production handoff and provenance patch
        shell: python
        run: |
          from pathlib import Path

          server_path = Path("src/server.js")
          server = server_path.read_text()

          old_call = '''  const garmentAnalysis = inferGarmentAndMaterial({
            zones: garmentZones?.zones,
            normalizedColors,
            colorEvidenceByZone,
          });'''
          new_call = '''  const garmentAnalysis = inferGarmentAndMaterial({
            zones: colorEvidenceShadowZones,
            normalizedColors,
            colorEvidenceByZone,
          });'''
          if server.count(old_call) != 1:
              raise SystemExit(f"Expected exactly one garment-analysis handoff match, found {server.count(old_call)}")
          server = server.replace(old_call, new_call, 1)

          anchor = '''  const locallyConsistent = finalizedVsRawDistance === null || finalizedVsRawDistance < 18;'''
          insertion = '''  const locallyConsistent = finalizedVsRawDistance === null || finalizedVsRawDistance < 18;

          const v3Publication = zoneData?.color_publication_v3;
          const v3PublishedHex = safeHex(v3Publication?.hex || "");
          const v3PublicationApplied =
            v3Publication?.action === "publish_v3" &&
            v3Publication?.applied_to_zone === true &&
            finalizedHex &&
            v3PublishedHex === finalizedHex;

          if (v3PublicationApplied) {
            return {
              status: "resolved",
              hex: finalizedHex,
              source: "color_evidence_v3_publication",
              confidence,
              finalized_vs_raw_lab: finalizedVsRawDistance,
              corroboration: {
                signature: signatureCorroborates,
                support: supportCorroborates,
                raw_agreement: locallyConsistent,
              },
              publication: {
                action: v3Publication.action,
                reason: v3Publication.reason || null,
                source: v3Publication.source || "color_evidence_v3",
              },
            };
          }'''
          if server.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one resolver anchor match, found {server.count(anchor)}")
          server = server.replace(anchor, insertion, 1)
          server_path.write_text(server)

          test_path = Path("test/colorEvidenceV3Handoff.test.js")
          test = test_path.read_text()
          old_assert = '''  assert.equal(consumer.hex, "#4E604F");
            assert.equal(publishedZone.color_evidence_v1.color_publication_v3.action, "publish_v3");'''
          new_assert = '''  assert.equal(consumer.hex, "#4E604F");
            assert.equal(consumer.source, "color_evidence_v3_publication");
            assert.equal(publishedZone.color_evidence_v1.color_publication_v3.action, "publish_v3");'''
          if test.count(old_assert) != 1:
              raise SystemExit(f"Expected exactly one V3 provenance assertion anchor, found {test.count(old_assert)}")
          test = test.replace(old_assert, new_assert, 1)
          test_path.write_text(test)

      - name: Focused production handoff regression
        run: node --test test/colorEvidenceV3Handoff.test.js

      - name: Full suite serially
        run: node --test --test-concurrency=1 test/*.test.js

      - name: Repository full suite
        run: npm test

      - name: Commit validated production handoff
        run: |
          git config user.name "visioncore-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/server.js test/colorEvidenceV3Handoff.test.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire V3 publication into production garment analysis"
          git push origin HEAD:visioncore-color-evidence-v3-fusion
