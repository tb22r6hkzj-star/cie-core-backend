name: Color Evidence V3

on:
  push:
    branches:
      - visioncore-color-evidence-v3-fusion
  pull_request:
    branches:
      - main

jobs:
  test-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run V3 focused regressions
        run: node --test test/colorEvidenceV3.test.js test/colorEvidenceV3Publication.test.js test/colorEvidenceV3Handoff.test.js
      - name: Run full suite
        run: npm test
