name: Apply Post Ownership Lineage V1

on:
  push:
    branches:
      - visioncore-post-ownership-lineage-v1
    paths:
      - scripts/apply-post-ownership-lineage-v1.mjs
      - .github/workflows/apply-post-ownership-lineage-v1.yml

permissions:
  contents: write

jobs:
  apply-lineage-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: visioncore-post-ownership-lineage-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic server patch
        run: node scripts/apply-post-ownership-lineage-v1.mjs

      - name: Check server syntax
        run: node --check src/server.js

      - name: Commit generated server change
        run: |
          if git diff --quiet -- src/server.js; then
            echo "No generated server change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Expose post-ownership accessory authority lineage"
          git push origin HEAD:visioncore-post-ownership-lineage-v1
